services:
    postgres:
        image: pgvector/pgvector:pg18
        container_name: sentinel_db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - pg_data:/var/lib/postgresql
        networks:
            - sentinel

    redis:
        image: redis:8-alpine
        container_name: sentinel_cache
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - cache:/data
        networks:
            - sentinel

    kafka:
        image: apache/kafka:4.2.1
        container_name: sentinel_events
        restart: unless-stopped
        ports:
            - "${KAFKA_PORT:-9092}:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}'
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
        volumes:
            - kafka_data:/var/lib/kafka/data
        networks:
            - sentinel

    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: sentinel_smart_events
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - sentinel

volumes:
    pg_data:
    cache:
    kafka_data:
    rabbitmq_data:

networks:
    sentinel:
        driver: bridge