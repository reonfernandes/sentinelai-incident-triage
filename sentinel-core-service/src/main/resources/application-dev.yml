server:
    port: 8080
spring:
    datasource:
        driver-class-name: org.postgresql.Driver
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sentinel_db}
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
    data:
        redis:
            host: localhost
            port: ${REDIS_PORT:6379}
            database: 0
    kafka:
        bootstrap-servers: localhost:${KAFKA_PORT:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
            acks: 1
            properties:
              spring.json.add.type.headers: true

        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
            group-id: sentinel-core-group
            auto-offset-reset: earliest
            properties:
                spring:
                    json:
                        trusted:
                            packages: "com.reon.dto"
    ai:
        google:
            genai:
                api-key: ${GOOGLE_GEMINI_API_KEY}
                chat:
                    model: gemini-3.8-flash
                    temperature: 0.2

app:
    kafka:
        topic:
            ingest: sentinel-ingest-topic
    redis:
        hash-ttl: 10m
    frontend:
        url: http://localhost:5173